name: 주간 운영 리포트

# 매주 월요일 아침 8시(KST) = 일요일 23:00 UTC
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul   # 날짜 계산 전부 KST(UTC 날짜가 기록에 박히던 계열 버그 일괄 차단, P b156 대칭)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성(최소)
        run: pip install requests
      - name: config.json 생성 (알림 키만 필요)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python build_config.py
      - name: 주간 리포트 전송
        run: python report.py
