name: 매일 블로그 자동 생성

# 매일 아침 7시(한국시간, KST=UTC+9) = UTC 22:00
# 백업 크론(8:30 KST): GitHub이 정기 크론을 조용히 건너뛰는 일이 실제로 있어(2026-09-01 실측)
# 90분 뒤 한 번 더 깨운다. 아래 '중복 실행 가드'가 이미 생성된 날은 생성을 건너뛰므로 이중 발행은 없다.
on:
  schedule:
    - cron: "43 21 * * *"   # 06:43 KST — 정시 회피(혼잡 시간대 지연 실측 9/3: 2.5h 지각)
    - cron: "13 23 * * *"   # 백업 08:13 KST
  workflow_dispatch:      # 폰/깃허브에서 수동 실행
    inputs:
      images:
        description: "이미지 생성 (true/false)"
        default: "true"
        required: false
      categories:
        description: "카테고리 JSON(앱에서 자동 전달). 비우면 시크릿/기본값 사용"
        default: ""
        required: false
      strategy:
        description: "키워드 전략: rankable | traffic | balanced"
        default: ""
        required: false
      ratio:
        description: "검색량 우선 비율 0~100(앱 슬라이더)"
        default: ""
        required: false
      strength:
        description: "안전/품질 강도: 느슨 | 표준 | 엄격 (앱 설정에서 전달)"
        default: ""
        required: false
      refresh_days:
        description: "오래된 글 자동 최신화 주기(일). 0=끔 (앱 설정에서 전달)"
        default: ""
        required: false
      paused:
        description: "일시정지: true면 생성 건너뜀 (앱 스위치에서 전달)"
        default: ""
        required: false
      drip_min:
        description: "드립 랜덤 최소 간격(시간) (앱 설정에서 전달)"
        default: ""
        required: false
      drip_max:
        description: "드립 랜덤 최대 간격(시간) (앱 설정에서 전달)"
        default: ""
        required: false
      coupang:
        description: "쿠팡 파트너스 삽입 (true/false)"
        default: ""
        required: false
      coupang_widget:
        description: "쿠팡 위젯 임베드 코드"
        default: ""
        required: false
      affiliate:
        description: "제휴 SaaS 추천 도구 박스 삽입 (true/false)"
        default: ""
        required: false
      affiliate_links:
        description: "제휴 링크 목록 (JSON 배열: name/url/desc)"
        default: ""
        required: false
      adsense_approved:
        description: "애드센스 승인됨 (true/false) — 승인 후 수익 최적화 활성"
        default: ""
        required: false
      ads_boost:
        description: "광고 배치 강화 (true/false) — 승인 후에만 적용"
        default: ""
        required: false

permissions:
  contents: write   # 결과 latest.json 을 저장소에 커밋하기 위함

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 한글 폰트 설치 (코드 썸네일용)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 진단 (버전·패키지 확인)
        run: |
          python --version
          echo "--- 설치된 핵심 패키지 ---"
          pip list 2>/dev/null | grep -i -E "google-generativeai|google-genai|openai|requests|pytrends" || echo "(핵심 패키지 확인 불가)"

      - name: 필수 키 확인
        run: |
          if [ -z "${{ secrets.LLM_API_KEY }}" ]; then
            echo "::error::LLM_API_KEY 시크릿이 비어 있습니다. Settings→Secrets에서 등록하세요."; exit 1
          fi
          echo "LLM_API_KEY 존재 확인 OK (provider=${{ secrets.LLM_PROVIDER }}, model=${{ secrets.LLM_MODEL }})"

      - name: config.json 생성 (시크릿에서)
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          CATEGORIES_JSON: ${{ github.event.inputs.categories != '' && github.event.inputs.categories || secrets.CATEGORIES_JSON }}
          KEYWORD_STRATEGY: ${{ github.event.inputs.strategy != '' && github.event.inputs.strategy || secrets.KEYWORD_STRATEGY }}
          TRAFFIC_RATIO: ${{ github.event.inputs.ratio != '' && github.event.inputs.ratio || secrets.TRAFFIC_RATIO }}
          BLOG_URL: ${{ secrets.BLOG_URL }}
          AUTHOR_NAME: ${{ secrets.AUTHOR_NAME }}
          AUTHOR_BIO: ${{ secrets.AUTHOR_BIO }}
          AUTHOR_TYPE: ${{ secrets.AUTHOR_TYPE }}
          LONG_SERIES: ${{ secrets.LONG_SERIES }}
          LONG_SINGLE: ${{ secrets.LONG_SINGLE }}
          SEASON_SERIES: ${{ secrets.SEASON_SERIES }}
          SEASON_SINGLE: ${{ secrets.SEASON_SINGLE }}
          INSERT_ADS: ${{ secrets.INSERT_ADS }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_ENABLED: ${{ github.event.inputs.images }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          METRICS_PROVIDER: ${{ secrets.METRICS_PROVIDER }}
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_SECRET_KEY }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_CUSTOMER_ID }}
          WP_ENABLED: ${{ secrets.WP_ENABLED }}
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_STATUS: ${{ secrets.WP_STATUS }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SC_SITE_URL: ${{ secrets.SC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ADSENSE_ACCOUNT: ${{ secrets.ADSENSE_ACCOUNT }}
          ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          REFRESH_DAYS: ${{ github.event.inputs.refresh_days != '' && github.event.inputs.refresh_days || secrets.REFRESH_DAYS }}
          REFRESH_MAX_PER_RUN: ${{ secrets.REFRESH_MAX_PER_RUN }}
          DRIP_MIN_HOURS: ${{ github.event.inputs.drip_min != '' && github.event.inputs.drip_min || secrets.DRIP_MIN_HOURS }}
          DRIP_MAX_HOURS: ${{ github.event.inputs.drip_max != '' && github.event.inputs.drip_max || secrets.DRIP_MAX_HOURS }}
          ADSENSE_APPROVED: ${{ github.event.inputs.adsense_approved != '' && github.event.inputs.adsense_approved || vars.ADSENSE_APPROVED }}
          ADS_BOOST: ${{ github.event.inputs.ads_boost != '' && github.event.inputs.ads_boost || secrets.ADS_BOOST }}
          COUPANG_ENABLED: ${{ github.event.inputs.coupang != '' && github.event.inputs.coupang || secrets.COUPANG_ENABLED }}
          COUPANG_WIDGET_HTML: ${{ github.event.inputs.coupang_widget != '' && github.event.inputs.coupang_widget || secrets.COUPANG_WIDGET_HTML }}
          AFFILIATE_ENABLED: ${{ github.event.inputs.affiliate != '' && github.event.inputs.affiliate || secrets.AFFILIATE_ENABLED }}
          AFFILIATE_LINKS: ${{ github.event.inputs.affiliate_links != '' && github.event.inputs.affiliate_links || secrets.AFFILIATE_LINKS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PAUSED: ${{ github.event.inputs.paused != '' && github.event.inputs.paused || vars.PAUSED }}
          SAFETY_STRENGTH: ${{ github.event.inputs.strength != '' && github.event.inputs.strength || secrets.SAFETY_STRENGTH }}
          FORCE_DRAFT: ${{ secrets.FORCE_DRAFT }}
          QUALITY_MIN_CHARS: ${{ secrets.QUALITY_MIN_CHARS }}
          QUALITY_MIN_H2: ${{ secrets.QUALITY_MIN_H2 }}
          QUALITY_MAX_DENSITY: ${{ secrets.QUALITY_MAX_DENSITY }}
          QUALITY_MAX_SIMILARITY: ${{ secrets.QUALITY_MAX_SIMILARITY }}
          VERIFY_ACCURACY: ${{ secrets.VERIFY_ACCURACY }}
          AUTO_REVISE: ${{ secrets.AUTO_REVISE }}
          RELINK_OLD: ${{ secrets.RELINK_OLD }}
          BLOCKLIST_EXTRA: ${{ secrets.BLOCKLIST_EXTRA }}
        run: python build_config.py

      # 카테고리 단일 소스: 수동실행 입력 > data/site_categories.json > 시크릿
      # (옛 카테고리 시크릿이 니치 밖 초안을 만들던 문제의 영구 해결 — 2026-08-30)
      - name: 카테고리 저장소 파일 적용
        if: github.event.inputs.categories == ''
        run: python scripts/apply_site_categories.py

      # 크론 스킵 자가 복구: 정기 실행이 같은 날 두 번 깨어나도 생성은 하루 1회만.
      - name: 중복 실행 가드
        id: dup
        if: github.event_name == 'schedule'
        run: |
          today=$(date -u +%F)
          gen=$(python3 -c "import json;print(json.load(open('dashboard/data/latest.json')).get('generated_at','')[:10])" 2>/dev/null || echo "")
          if [ "$gen" = "$today" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘($today) 이미 생성 완료 — 생성 단계 건너뜀(백업 크론). 점검·색인은 계속 진행"
          fi

      - name: 블로그 생성 실행
        if: steps.dup.outputs.skip != 'true'
        run: python -u main.py

      # 예약 발행(WP 크론)으로 공개된 글 포함, 최근 36시간 새 글을
      # IndexNow(네이버·빙)+WebSub(구글 RSS 푸시)로 자동 통지 — '등록해두면 알아서'
      - name: 새 글 자동 색인 통지
        if: always()
        run: python scripts/ping_new_posts.py || true

      # URL Inspection API(하루 2,000회, insights 서비스 계정 재사용):
      # 최근 수정 글을 검사해 ①구글 fetch 유발(재크롤 넛지) ②색인 신호등 기록
      # → 수동 '색인 생성 요청'의 API판. 결과는 dashboard/data/index_status.json
      - name: 색인 검사·넛지 (Inspection API)
        if: always()
        run: python scripts/inspect_recent.py || true

      # 점검·수리의 서버 이전(v1): 대시보드 채점을 매일 서버에서 수행,
      # auto_repair 켜진 사이트는 미달 글을 자동 재작성(캡 5편) — 앱을 안 열어도 관리되는 상태
      - name: 사이트 점검·자동 수리
        if: always()
        run: python scripts/daily_check_fix.py || true

      - name: 결과 커밋 (대시보드가 읽음)
        if: always()   # 생성 일부 실패해도 만들어진 결과는 커밋
        run: |
          git config user.name "blog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dashboard/data/*.json 2>/dev/null || true
          git commit -m "자동 생성: $(date -u '+%Y-%m-%d %H:%M')" || { echo "변경 없음"; exit 0; }
          # push 경쟁 재시도 루프(2026-09-01): '1회 rebase 후 push || echo'는 rebase나 push가
          # 실패하면 결과가 조용히 사라졌다(#100에서 재현 — 사용자 push와 경쟁해 점검 결과 유실).
          # --autostash: 실행 중 파이프라인이 건드린 다른 파일(예: 카테고리 적용의 재기록)이
          # 작업트리에 남아 rebase가 "unstaged changes"로 거부되던 진짜 원인 해결(2026-09-01 #101 실측)
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && { echo "push 성공(${i}차)"; exit 0; }
            echo "push 경쟁 — ${i}차 재시도"; sleep $((i*7))
          done
          echo "::warning::결과 push 3회 실패 — 이번 데이터는 다음 실행에서 재생성됩니다"
