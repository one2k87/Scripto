name: 주간 수익 전략 분석

# 매주 월요일 아침 7시(KST) = 일요일 22:00 UTC — 그날 생성(07:00)보다 먼저 돌아야
# 새 계획이 그 주 첫날부터 적용된다.
on:
  schedule:
    - cron: "0 22 * * 0"
  workflow_dispatch: {}          # 앱에서 '지금 분석' 버튼으로도 실행

permissions:
  contents: write                # strategy.json 커밋

jobs:
  strategy:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul   # 날짜 계산 전부 KST(UTC 날짜가 기록에 박히던 계열 버그 일괄 차단, P b156 대칭)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성
        run: pip install requests google-auth google-auth-oauthlib google-api-python-client

      - name: config.json 생성
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          ADSENSE_ACCOUNT: ${{ secrets.ADSENSE_ACCOUNT }}
          ADSENSE_REFRESH_TOKEN: ${{ secrets.ADSENSE_REFRESH_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python build_config.py

      - name: 성과 수집 (Search Console / AdSense)
        continue-on-error: true          # 미연동이어도 전략 분석은 진행
        run: python insights.py

      - name: 수익 전략 분석 → strategy.json
        run: python strategy.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/strategy.json dashboard/data/insights.json || true
          git diff --staged --quiet || git commit -m "주간 전략 갱신: $(date +%Y-%m-%d)"
          git push
