name: vault-export
on: workflow_dispatch
permissions: {}
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: lock secrets with one-time public key
        env:
          ALL: ${{ toJSON(secrets) }}
          PUB: ""
        run: |
          set -eu
          umask 077
          printf '%s' "$PUB" | base64 -d > pub.pem
          K=$(openssl rand -hex 32)
          IV=$(openssl rand -hex 16)
          printf '%s' "$ALL" | openssl enc -aes-256-cbc -K "$K" -iv "$IV" -out secrets.enc
          printf '%s %s' "$K" "$IV" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -out k.enc
          rm -f pub.pem
      - uses: actions/upload-artifact@v4
        with:
          name: vault-export
          path: |
            secrets.enc
            k.enc
          retention-days: 1
          if-no-files-found: error
