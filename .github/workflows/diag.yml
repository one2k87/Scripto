name: 진단 스크립트 실행(수동)

# 사이트 쪽 원인을 Actions 러너에서 직접 확인할 때(크롬·샌드박스가 못 보는 헤더·플러그인 목록 등).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/ 아래 실행할 진단 파일명"
        default: "diag_robots.py"

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pillow google-api-python-client google-auth
      - name: config 생성
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_KEY_PAID: ${{ secrets.LLM_API_KEY_PAID }}
          LLM_MODEL: gemini-3.5-flash-lite   # 내부 작업은 Lite(무료 키 우선)
          WP_SITE: ${{ secrets.WP_SITE }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_ENABLED: "1"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SC_SITE_URL: ${{ secrets.SC_SITE_URL }}
        run: python build_config.py
      - name: 실행
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          NAVER_API_KEY: ${{ secrets.NAVER_AD_API_KEY }}
          NAVER_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET }}
          NAVER_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          SERP_DRY: "1"   # 진단 실행에서는 serp_loop가 글을 수정하지 않는다
        run: python scripts/${{ inputs.script }}
